<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>观看页</title>
<style>
body{font-family:sans-serif;max-width:640px;margin:32px auto;padding:0 16px;color:#222}
.player{background:#111827;color:#f9fafb;border-radius:8px;padding:48px;text-align:center}
.denied{background:#fee2e2;color:#991b1b;padding:12px;border-radius:4px;margin-top:12px}
form{margin-top:12px;display:flex;flex-direction:column;gap:8px}
button{padding:8px;background:#dc2626;color:#fff;border:0;border-radius:4px;cursor:pointer;width:180px}
input,textarea{padding:6px;border:1px solid #ccc;border-radius:4px}
a{color:#2563eb}.flash{background:#dcfce7;color:#166534;padding:8px;border-radius:4px}
</style></head>
<body>
<h1>{{.Decision.Title}}</h1>
<p><a href="/catalog">← 返回目录</a> | <a href="/me">我的记录</a></p>
{{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
{{if .Decision.Allowed}}
<div class="player">▶ 正在播放（演示地址）：{{.Decision.PlayURL}}</div>
<p>演示播放地址：{{.Decision.PlayURL}}</p>
{{else}}
<div class="denied">无法观看：{{.Decision.Reason}}</div>
{{if .Decision.Refunded}}
<p>你可以<a href="/catalog">重新购买</a>该集。</p>
{{else}}
<form method="post" action="/refund">
  <h3>申请退款（暂停观看期间，已购用户可申请退还本集平台币）</h3>
  <input type="hidden" name="episode_id" value="{{.EpisodeID}}">
  <textarea name="reason" placeholder="退款原因（必填）" required></textarea>
  <button type="submit">申请退款</button>
</form>
{{end}}
{{end}}
</body></html>
